name: Continuous Integration

on:
  push:
    branches: [ master ]

jobs:

  linux:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run:  sudo apt-get update && sudo apt-get install libtiff-dev

    - name: Configure
      run: |
        ./autogen.sh
        ./configure

    - name: Compile
      run: make

    - name: Test
      run: make check

